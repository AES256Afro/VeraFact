# How reviewers' own rating words map onto VeraFact's normalised verdicts.
#
# The reviewer's words are always shown; this table only decides the badge
# colour and the ordering. Matching is case-insensitive on the whole phrase
# first, then on the longest phrase contained in the rating text, so
# "Mostly False" wins over "False" and "Not the Whole Story" over "True".
# A rating that matches nothing stays "unrated" and is shown as the source wrote it.

verdicts:
  "true":
    - "true"
    - "correct"
    - "accurate"
    - "legit"
    - "genuine"
    - "geppetto checkmark"
    - "correct attribution"
    - "verified"
  mostly-true:
    - "mostly true"
    - "mostly correct"
    - "mostly accurate"
    - "largely true"
    - "largely accurate"
    - "one pinocchio"
    - "partly true"
    - "true but"
    - "needs context"
    - "not the whole story"
    - "lacks context"
  mixed:
    - "mixed"
    - "mixture"
    - "half true"
    - "half-true"
    - "partly false"
    - "partially true"
    - "partially false"
    - "partially correct"
    - "two pinocchios"
    - "in dispute"
    - "it's complicated"
    - "complicated"
    - "depends"
  mostly-false:
    - "mostly false"
    - "mostly incorrect"
    - "mostly wrong"
    - "largely false"
    - "three pinocchios"
    - "barely true"
    - "exaggerated"
    - "exaggerates"
    - "overstated"
    - "cherry-picks"
    - "cherry picks"
  "false":
    - "false"
    - "pants on fire"
    - "four pinocchios"
    - "incorrect"
    - "wrong"
    - "fake"
    - "fabricated"
    - "fiction"
    - "hoax"
    - "scam"
    - "bogus"
    - "not true"
    - "untrue"
    - "debunked"
    - "no, "
    - "inaccurate"
    - "fabrication"
    - "altered"
    - "doctored"
    - "manipulated"
    - "faux"
    - "falso"
    - "falsch"
    - "faux : "
  misleading:
    - "misleading"
    - "miscaptioned"
    - "missing context"
    - "out of context"
    - "distorts"
    - "distorted"
    - "spins"
    - "mischaracterizes"
    - "misrepresents"
    - "misattributed"
    - "flip-flop"
    - "full flop"
    - "half flip"
    - "context"
  unproven:
    - "unproven"
    - "unverified"
    - "unsupported"
    - "no evidence"
    - "research in progress"
    - "undetermined"
    - "unknown"
    - "unclear"
    - "not enough evidence"
    - "insufficient evidence"
    - "cannot be verified"
    - "can't be verified"
    - "unfounded"
    - "baseless"
    - "legend"
  satire:
    - "satire"
    - "labeled satire"
    - "labelled satire"
    - "parody"
    - "originated as satire"
  outdated:
    - "outdated"
    - "old news"
    - "no longer true"
    - "was true"
    - "recalled"
    - "stale"


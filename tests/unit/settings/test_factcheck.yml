# VeraFact fact-check mode tests: only the tier 1 engine, with a dummy key.

use_default_settings:

  engines:
    # remove all engines
    keep_only: []

search:

  formats: [html, json]

server:

  secret_key: "user_secret_key"

fork:
  factcheck:
    google_api_key: "test-key"

engines:

  - name: google fact check
    engine: google_factcheck
    shortcut: gfc
    categories: ["fact check"]
    timeout: 3

  - name: politifact
    engine: factcheck_politifact
    shortcut: pf
    timeout: 3

  - name: factcheck.org
    engine: factcheck_wordpress
    base_url: https://www.factcheck.org
    reviewer: FactCheck.org
    shortcut: fco
    timeout: 3

  - name: snopes
    engine: factcheck_site
    site: snopes.com
    base_engine: fakebase
    shortcut: snp
    timeout: 3

schemaVersion: 2
id: verafact
name: VeraFact
category: Knowledge
icon: "✅"
description: "Search the web, keep the facts. A private metasearch engine with a fact-check mode: a claim is checked against PolitiFact, Snopes, FactCheck.org, Full Fact, AFP and Lead Stories and laid out as claim, verdict and source. Built on SearXNG. A local or frontier model can summarise what the reviewers found; it is off until you turn it on."
website: https://github.com/AES256Afro/VeraFact
risk: low
# Searches are private and the model keys live here, so it starts on the tailnet only; the Reach tab can open it to the home network.
defaultExposure: tailnet
image:
  # Pin to a tag and digest once the first image is published (the VeraFact container workflow prints the tag).
  reference: ghcr.io/aes256afro/verafact:latest
  version: "latest"
ports:
  - id: web
    label: Search page
    container: 8080
    host: 8899
    exposure: lan
volumes:
  - id: config
    label: Settings
    container: /etc/searxng
    path: config
    description: settings.yml, written from the built-in template at first start. Edit it to change engines, defaults and the fork options.
  - id: cache
    label: Cache
    container: /var/cache/searxng
    path: cache
    backup: false
    description: Favicons and fetched fact-check pages; safe to clear.
# Reaches this server's Ollama, which publishes port 11434 on the host.
extraHosts: ["host.docker.internal:host-gateway"]
connections:
  - app: ollama
    role: Local model
    where: Model backend and Model address
    note: Only used when the model backend is openai_compat and the address points at this server's Ollama.
env:
  - name: SEARXNG_SECRET
    label: Secret key
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. Signs the preferences cookie and the image proxy links.
  - name: SEARXNG_BASE_URL
    label: Public address
    description: "The address people open the search at, with the port. On the tailnet that is https://<this server's tailnet name>:8899; links and the preferences cookie are wrong without it."
    default: "https://${TAILNET_HOST}:${PORT_WEB}"
  - name: FORK_LLM_BACKEND
    label: Model backend
    description: "disabled runs no model at all. openai_compat is a local server such as this server's Ollama, LM Studio or llama.cpp. anthropic and openai are frontier APIs and need a key; with those, pages you fact-check are summarised off this server."
    default: disabled
    options: ["disabled", "openai_compat", "anthropic", "openai"]
  - name: FORK_LLM_BASE_URL
    label: Model address
    description: For openai_compat only. This server's Ollama app answers at http://host.docker.internal:11434/v1.
    default: http://host.docker.internal:11434/v1
  - name: FORK_LLM_MODEL
    label: Model
    optionsFrom: ollama-models
    description: The model the backend runs. For a frontier backend, type that provider's model name instead.
    default: ""
  - name: FORK_LLM_API_KEY
    label: Model API key
    type: password
    secret: true
    description: Needed for the anthropic and openai backends; ignored otherwise.
    default: ""
  - name: FORK_FACTCHECK_GOOGLE_API_KEY
    label: Google Fact Check API key (optional)
    type: password
    secret: true
    description: "A free key from a Google Cloud project with the Fact Check Tools API enabled. Adds one source that reaches every IFCN signatory's reviews; the six built-in sources work without it."
    default: ""
publicHostname:
  env: SEARXNG_BASE_URL
health:
  kind: healthcheck
  timeoutSeconds: 120
notes: >-
  Open the search page and type a claim, or switch to Check a claim first. Reviews come from
  PolitiFact, Snopes, FactCheck.org, Full Fact, AFP and Lead Stories; a summary line above them
  counts the verdicts. No model is needed for that. To let a model summarise the reviews, set the
  model backend above: openai_compat with this server's Ollama keeps everything on this server.

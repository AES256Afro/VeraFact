<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- VeraFact logo, one-colour form: mark A plus the wordmark in teal.
     The two-tone wordmark used on the pages is HTML (templates/simple/fork/wordmark.html)
     so "Fact" can follow the theme's text colour; this file is for the PNG and PWA uses.
     The file keeps upstream's name so client/simple/vite.config.ts stays untouched. -->
<svg xmlns="http://www.w3.org/2000/svg" width="236mm" height="48mm" viewBox="0 0 236 48" fill="none">
  <g stroke="#0f6e8c" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.45">
    <path d="M12 14h24M12 22h24M12 30h24M14 12v24M22 12v24M30 12v24"/>
  </g>
  <path d="M13 26l8 8 15-17" stroke="#0f6e8c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="36" fill="#0f6e8c" font-family="Albert Sans, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="36" letter-spacing="-1.2">VeraFact</text>
</svg>
